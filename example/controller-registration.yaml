---
apiVersion: core.gardener.cloud/v1
kind: ControllerDeployment
metadata:
  name: networking-cilium
helm:
  rawChart: 
  values:
    image:
      repository: registry.local.gardener.cloud:5001/cilium/extensions/networking-cilium
      tag: v1.48.0-dev
      pullPolicy: Always
---
apiVersion: core.gardener.cloud/v1beta1
kind: ControllerRegistration
metadata:
  name: networking-cilium
  annotations:
    security.gardener.cloud/pod-security-enforce: baseline
spec:
  deployment:
    deploymentRefs:
    - name: networking-cilium
  resources:
  - kind: Network
    type: cilium
  - kind: SelfHostedShootExposure
    type: cilium
